<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
  <title id="title">Break-even chart for fixed costs £12,000, selling price £30 and variable cost £18 per unit</title>
  <desc id="desc">A break-even graph with output from zero to 2,000 units horizontally and money from zero to £60,000 vertically. Total revenue rises from zero to £60,000. Total costs begin at fixed costs of £12,000 and rise to £48,000. The lines intersect at 1,000 units and £30,000, the break-even point.</desc>
  <rect width="760" height="470" fill="#fff"/>
  <text x="380" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172554">Break-even chart</text>
  <text x="380" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#334155">Price £30/unit · variable cost £18/unit · fixed costs £12,000</text>
  <!-- Plot area: x=120..650 maps 0..2000 units; y=360..70 maps £0..£60,000 -->
  <g stroke="#dbe2ea" stroke-width="1">
    <line x1="120" y1="311.7" x2="650" y2="311.7"/><line x1="120" y1="263.3" x2="650" y2="263.3"/>
    <line x1="120" y1="215" x2="650" y2="215"/><line x1="120" y1="166.7" x2="650" y2="166.7"/>
    <line x1="120" y1="118.3" x2="650" y2="118.3"/><line x1="252.5" y1="70" x2="252.5" y2="360"/>
    <line x1="385" y1="70" x2="385" y2="360"/><line x1="517.5" y1="70" x2="517.5" y2="360"/>
  </g>
  <g stroke="#0f172a" stroke-width="2"><line x1="120" y1="70" x2="120" y2="360"/><line x1="120" y1="360" x2="650" y2="360"/></g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#334155" text-anchor="end">
    <text x="109" y="364">£0</text><text x="109" y="315.7">£10,000</text><text x="109" y="267.3">£20,000</text>
    <text x="109" y="219">£30,000</text><text x="109" y="170.7">£40,000</text><text x="109" y="122.3">£50,000</text><text x="109" y="74">£60,000</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">
    <text x="120" y="381">0</text><text x="252.5" y="381">500</text><text x="385" y="381">1,000</text><text x="517.5" y="381">1,500</text><text x="650" y="381">2,000</text>
  </g>
  <text x="385" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#172554">Output (units)</text>
  <text x="25" y="215" transform="rotate(-90 25 215)" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#172554">Revenue / costs (£)</text>
  <!-- Revenue: (0,0) to (2000,60000); costs: (0,12000) to (2000,48000) -->
  <line x1="120" y1="360" x2="650" y2="70" stroke="#2563eb" stroke-width="4"/>
  <line x1="120" y1="302" x2="650" y2="128" stroke="#dc2626" stroke-width="4"/>
  <line x1="385" y1="215" x2="385" y2="360" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 5"/>
  <circle cx="385" cy="215" r="6" fill="#111827"/>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="700">
    <text x="545" y="91" fill="#1d4ed8">Total revenue</text>
    <text x="528" y="142" fill="#b91c1c">Total costs</text>
    <text x="392" y="202" fill="#111827">Break-even: £30,000</text>
    <text x="392" y="221" fill="#111827">and 1,000 units</text>
    <text x="126" y="296" fill="#b91c1c">Fixed costs: £12,000</text>
  </g>
</svg>
